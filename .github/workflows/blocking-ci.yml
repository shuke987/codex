name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main, codex/exec-goal]

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    if: github.repository == 'openai/codex'
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    if: github.repository == 'openai/codex'
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    if: github.repository == 'openai/codex'
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  fork-exec:
    name: Linux exec-goal
    if: github.repository != 'openai/codex'
    uses: ./.github/workflows/fork-exec-ci.yml

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
      - fork-exec
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same combined revision as the child workflows so
      # the merge gate evaluates the exact candidate they validated.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import runpy

          needs = json.loads(os.environ["NEEDS"])
          expected = {"bazel", "blob-size-policy", "cargo-deny", "codespell", "repo-checks", "rust-ci", "sdk", "fork-exec"}
          if needs.keys() != expected:
              raise SystemExit("Incomplete CI dependency results")
          upstream = os.environ["GITHUB_REPOSITORY"] == "openai/codex"
          inactive = ["fork-exec"] if upstream else ["bazel", "rust-ci", "sdk"]
          for name in inactive:
              if needs.pop(name)["result"] != "skipped":
                  raise SystemExit(f"Unexpected CI profile result for {name}")
          os.environ["NEEDS"] = json.dumps(needs)
          runpy.run_path(".github/scripts/check_ci_results.py", run_name="__main__")
          PY
